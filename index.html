<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="images/favicon.png" type="image/png" />
    <title>My Hot Wheels Garage</title>
  </head>
  <body>
    <main class="page">
      <div class="speed-lines" aria-hidden="true"></div>
      <header class="hero">
        <h1>My Hot Wheels Garage</h1>
      </header>

      <section class="search-panel" aria-label="Car search">
        <label for="search" class="sr-only">Search car name</label>
        <div class="input-wrap">
          <div class="search-input-container">
            <input
              id="search"
              type="search"
              placeholder="Try: mustang, batmobile, mazda..."
              autocomplete="off"
              spellcheck="false"
            />
            <button id="clearSearch" type="button" aria-label="Clear search" disabled>
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
        </div>

        <div id="brandChips" class="brand-chips" aria-label="Filter by brand">
          <!-- Dynamic Chips will be rendered here -->
        </div>

        <div id="statsDashboard" class="stats-dashboard">
          <div class="stats-card">
            <span class="stats-label">Total Collection</span>
            <span id="statTotal" class="stats-value">0</span>
          </div>
          <div class="stats-card">
            <span class="stats-label">Unique Castings</span>
            <span id="statUnique" class="stats-value">0</span>
          </div>
          <div class="stats-card status-card">
            <span class="stats-label">Status</span>
            <span id="stats" class="stats-value stats-msg" aria-live="polite">Loading collection...</span>
          </div>
        </div>
      </section>

      <section class="results-panel" aria-label="Search results">
        <ul id="results" class="results"></ul>
      </section>

      <footer class="site-footer">
        <a href="https://github.com/2KAbhishek/hot-wheels" target="_blank" rel="noopener noreferrer">
          View source on GitHub
        </a>
      </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <script src="script.js"></script>
  </body>
</html>
